version: 2
updates:
  # GitHub Actions in our workflows — keeps the SHA pins (and their version
  # comments) current. Grouped into one PR to limit noise.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ['*']
    commit-message:
      prefix: ci

  # Dev dependencies (pnpm). The Action ships zero runtime deps, so everything
  # here is devDependencies — bundler, typechecker, test/lint tooling.
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    groups:
      dev-dependencies:
        patterns: ['*']
    ignore:
      # The action runs on node24 (action.yml), so the Node types stay on
      # major version 24. Move both together.
      - dependency-name: '@types/node'
        update-types: ['version-update:semver-major']
    commit-message:
      prefix: deps
